name: Build Android APK and Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gamelab-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform scaffold
        run: flutter create --platforms=android --org com.ehtid --project-name game_lab .
      - name: Install native Android SAF
        run: python3 tool/prepare_android.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify and checksum APK
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          sha256sum "$apk" > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EHTID-GameLab-Android-APK
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Windows platform scaffold
        run: flutter create --platforms=windows --org com.ehtid --project-name game_lab .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package complete portable application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'build/windows/x64/runner/Release'
          $exe = Join-Path $release 'game_lab.exe'
          if (!(Test-Path $exe -PathType Leaf)) { throw "Missing Windows executable: $exe" }
          if ((Get-Item $exe).Length -eq 0) { throw "Empty Windows executable" }
          foreach ($required in @('flutter_windows.dll', 'data/icudtl.dat', 'data/flutter_assets')) {
            if (!(Test-Path (Join-Path $release $required))) { throw "Missing Windows runtime component: $required" }
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$release/*" -DestinationPath 'dist/EHTID-GameLab-Windows-portable.zip' -Force
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist/EHTID-GameLab-Windows-portable.zip'))
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\\', '/') })
            foreach ($required in @('game_lab.exe', 'flutter_windows.dll', 'data/icudtl.dat')) {
              if ($entries -notcontains $required) { throw "Portable ZIP missing required entry: $required" }
            }
            if (!(@($entries | Where-Object { $_ -like 'data/flutter_assets/*' }).Count -gt 0)) {
              throw 'Portable ZIP missing Flutter assets'
            }
          } finally {
            $zip.Dispose()
          }
          Get-FileHash 'dist/EHTID-GameLab-Windows-portable.zip' -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  EHTID-GameLab-Windows-portable.zip" } |
            Set-Content 'dist/SHA256SUMS.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: EHTID-GameLab-Windows-portable
          if-no-files-found: error
          path: |
            dist/EHTID-GameLab-Windows-portable.zip
            dist/SHA256SUMS.txt
          retention-days: 14
