name: Import v0.3 source and build Android + Windows
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and restore source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/??.b64 | base64 --decode > /tmp/ehtid-source.tar.xz
          echo "65a1f20fad3a542917dda9f5e2a97f4ac60d10e6c737d1a0012765234a9760a8  /tmp/ehtid-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ehtid-source.tar.xz
          test -f lib/main.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore pubspec.yaml lib test tool android_native .github/workflows/build.yml
          if ! git diff --cached --quiet; then
            git commit -m "Import EHTID Game Lab v0.3.0 source"
            git push origin HEAD:main
          fi

  android:
    needs: materialize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.ehtid --project-name game_lab .
      - run: python3 tool/prepare_android.py
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: EHTID-GameLab-v0.3.0-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    needs: materialize
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows --org com.ehtid --project-name game_lab .
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: EHTID-GameLab-v0.3.0-Windows
          path: build/windows/x64/runner/Release/**
